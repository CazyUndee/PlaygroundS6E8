          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Feature-group ablation (lgbm_63, seed-42, 5-fold)
        run: |
          python -u state/exp_ablate.py 2>&1 | tee ablate_run.log
          echo "=== tail ==="
          tail -20 ablate_run.log

      - name: Package artifacts
        run: |
          mkdir -p artifacts/ablate
          cp ablate_results.json artifacts/ablate/
          cp ablate_run.log artifacts/ablate/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ablate-results
          path: artifacts/ablate/
          retention-days: 90

  forensics:
    if: ${{ inputs.task == 'forensics' || inputs.task == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reproducible forensics
        run: |
          mkdir -p artifacts/forensics
          for f in state/analysis/forensics_*.py; do
            name=$(basename "$f" .py)
            python "$f" > "artifacts/forensics/${name}.out" 2>&1 && echo "OK $name" || echo "FAILED $name"
          done

      - name: Upload forensics outputs
        uses: actions/upload-artifact@v4
        with:
          name: forensics-outputs
          path: artifacts/forensics/
          retention-days: 90

  smoke:
    if: ${{ inputs.task == 'smoke' || inputs.task == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import + feature smoke test
        run: |
          python -c "import source.train_pipeline, source.features, source.models, source.ensemble, source.utils; print('source imports OK')"
          python -c "import state.exp_screen_features; print('state->source import chain OK')"
          python -c "import state.exp027_leaves31; print('exp027 script import OK')"
          python -c "import pandas as pd; from source.train_pipeline import build_features, feature_columns; df = build_features(pd.read_csv('train.csv', nrows=2000)); assert len(feature_columns()) == 44; print('build_features OK (44 cols)')"

  exp027:
    if: ${{ inputs.task == 'exp027' || inputs.task == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EXP-027 dual-seed tune scan (leaves_31, leaves_31+sub095, canonical)
        run: |
          python -u state/exp027_leaves31.py 2>&1 | tee exp027_run.log
          echo "=== tail ==="
          tail -20 exp027_run.log

      - name: Package artifacts
        run: |
          mkdir -p artifacts/exp027
          cp exp027_results.json artifacts/exp027/
          cp exp027_run.log artifacts/exp027/
          for arm in exp027_leaves_31 exp027_leaves_31_sub095 exp027_canonical_63; do
            if [ -d "$arm" ]; then
              mkdir -p "artifacts/exp027/$arm"
              cp "$arm"/*.csv "$arm"/*.npy "artifacts/exp027/$arm/" 2>/dev/null || true
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exp027-results
          path: artifacts/exp027/
          retention-days: 90

  exp028_combo:
    if: ${{ inputs.task == 'exp028_combo' || inputs.task == 'all' }}
