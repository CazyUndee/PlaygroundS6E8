name: research-compute

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Research task to run on this runner"
        type: choice
        options:
          - exp023_canonical
          - screen
          - tune
          - forensics
          - all
        default: exp023_canonical
      feature:
        description: "Feature to screen (used when task == screen)"
        type: choice
        options:
          - total_screen
          - sm_weekend
          - all3
          - age
          - both
        default: total_screen

# All compute happens here on hosted Linux runners. Local machine is
# orchestration only (git push / gh workflow run / artifact download).
# No concurrency gate: GH runners are isolated, so parallel runs are safe
# (and rapid workflow_dispatch triggers were getting spuriously cancelled).
permissions:
  contents: read

jobs:
  exp023_canonical:
    if: ${{ inputs.task == 'exp023_canonical' || inputs.task == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run canonical dual-seed 5-fold pipeline (EXP-023)
        run: |
          python -u agent/train_pipeline.py --out submission_matched_super.csv 2>&1 | tee exp023_run.log
          echo "=== tail ==="
          tail -20 exp023_run.log

      - name: Package artifacts
        run: |
          mkdir -p artifacts/exp023
          cp submission_matched_super.csv artifacts/exp023/submission.csv
          cp pipeline_results.json artifacts/exp023/pipeline_results.json
          tar -czf artifacts/exp023/oof_arrays.tar.gz oof_*.npy test_*.npy 2>/dev/null || true
          cp exp023_run.log artifacts/exp023/exp023_run.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exp023-results
          path: artifacts/exp023/
          retention-days: 90

  screen:
    if: ${{ inputs.task == 'screen' || inputs.task == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Screen feature (lgbm_63, seed-42, 5-fold)
        run: |
          python -u exp_screen_features.py --feature ${{ inputs.feature }} 2>&1 | tee screen_run.log
          echo "=== tail ==="
          tail -20 screen_run.log

      - name: Package artifacts
        run: |
          mkdir -p artifacts/screen
          cp screen_${{ inputs.feature }}.json artifacts/screen/ 2>/dev/null || true
          tar -czf artifacts/screen/preds.tar.gz oof_screen_${{ inputs.feature }}.npy test_screen_${{ inputs.feature }}.npy 2>/dev/null || true
          cp screen_run.log artifacts/screen/screen_run.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screen-${{ inputs.feature }}-results
          path: artifacts/screen/
          retention-days: 90

  tune:
    if: ${{ inputs.task == 'tune' || inputs.task == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Hyperparameter scan (lgbm_63, seed-42, 5-fold)
        run: |
          python -u exp_tune_lgbm.py 2>&1 | tee tune_run.log
          echo "=== tail ==="
          tail -20 tune_run.log

      - name: Package artifacts
        run: |
          mkdir -p artifacts/tune
          cp tune_results.json artifacts/tune/
          cp tune_run.log artifacts/tune/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tune-results
          path: artifacts/tune/
          retention-days: 90

  forensics:
    if: ${{ inputs.task == 'forensics' || inputs.task == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reproducible forensics
        run: |
          mkdir -p artifacts/forensics
          for f in analysis/forensics_*.py; do
            name=$(basename "$f" .py)
            python "$f" > "artifacts/forensics/${name}.out" 2>&1 && echo "OK $name" || echo "FAILED $name"
          done

      - name: Upload forensics outputs
        uses: actions/upload-artifact@v4
        with:
          name: forensics-outputs
          path: artifacts/forensics/
          retention-days: 90
